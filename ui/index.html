<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file:; style-src 'self'" />
  <title>WebApp Forge</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">⌁</div>
      <div>
        <h1>WebApp Forge</h1>
        <p>Turn any website into a desktop app &amp; pin it to your taskbar</p>
      </div>
      <button id="manager-pin" type="button" class="ghost manager-pin"></button>
    </div>
  </header>

  <main>
    <form id="add-form" class="add-form" autocomplete="off">
      <input id="add-url" type="text" placeholder="Paste a URL — e.g. grok.com" spellcheck="false" required />
      <input id="add-name" type="text" placeholder="Name (optional)" spellcheck="false" />
      <button id="add-btn" type="submit" class="primary">Add app</button>
    </form>

    <div id="suggestions" class="suggestions" hidden>
      <span class="suggestions-label">Quick add:</span>
      <span id="suggestion-chips"></span>
    </div>

    <section id="app-grid" class="grid"></section>

    <div id="empty-state" class="empty" hidden>
      <div class="empty-glyph">⌁</div>
      <h2>No web apps yet</h2>
      <p>Paste a URL above, or start with one of the suggestions.</p>
    </div>
  </main>

  <dialog id="edit-dialog">
    <form id="edit-form" method="dialog">
      <h2>Edit app</h2>
      <label>Name <input id="edit-name" type="text" required spellcheck="false" /></label>
      <label>URL <input id="edit-url" type="text" required spellcheck="false" /></label>
      <div class="dialog-row">
        <button type="button" id="edit-refresh-icon" class="ghost">Re-fetch icon</button>
        <button type="button" id="edit-choose-icon" class="ghost">Choose icon…</button>
      </div>
      <div class="dialog-actions">
        <button type="button" id="edit-cancel" class="ghost">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="renderer.js"></script>
</body>
</html>
